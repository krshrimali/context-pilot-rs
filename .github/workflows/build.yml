name: Build

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: contextpilot
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: contextpilot
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: contextpilot.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-git-

    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-target-

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Test binary exists
      shell: bash
      run: |
        if [ -f "target/release/${{ matrix.binary }}" ]; then
          echo "✅ Binary built successfully: target/release/${{ matrix.binary }}"
          ls -lh target/release/${{ matrix.binary }}
        else
          echo "❌ Binary not found: target/release/${{ matrix.binary }}"
          exit 1
        fi

    - name: Test --help flag (Unix)
      if: runner.os != 'Windows'
      run: |
        ./target/release/${{ matrix.binary }} --help
        echo "✅ --help works on ${{ matrix.os }}"

    - name: Test --help flag (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & ".\target\release\${{ matrix.binary }}" --help
        Write-Host "✅ --help works on ${{ matrix.os }}"

    - name: Upload binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: contextpilot-${{ matrix.os }}
        path: target/release/${{ matrix.binary }}
        retention-days: 7

    - name: Build summary
      shell: bash
      run: |
        echo "### Build Summary for ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Release build completed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Binary exists and is executable" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ --help flag works correctly" >> $GITHUB_STEP_SUMMARY
        echo "- 📦 Binary uploaded as artifact" >> $GITHUB_STEP_SUMMARY
